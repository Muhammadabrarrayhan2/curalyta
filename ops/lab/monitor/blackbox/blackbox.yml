modules:
  # Endpoint /health: wajib HTTP 200 dan body berisi status "ok"
  http_health:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ['"status":"ok"']
      preferred_ip_protocol: ip4
      follow_redirects: true

  # Halaman web (frontend): cukup HTTP 2xx
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true

  icmp:
    prober: icmp
    timeout: 5s
