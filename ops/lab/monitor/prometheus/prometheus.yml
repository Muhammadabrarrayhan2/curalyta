# Prometheus — lab Curalyta
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    lab: curalyta

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metrik OS (CPU, memori, disk, jaringan) dari host Proxmox dan kedua VM
  - job_name: node
    static_configs:
      - targets: ["192.168.45.10:9100"]
        labels: { host: pve, role: hypervisor }
      - targets: ["192.168.45.20:9100"]
        labels: { host: curalyta-app, role: app }
      - targets: ["192.168.45.30:9100"]
        labels: { host: curalyta-monitor, role: monitoring }

  # Metrik per container (setara docker stats) di VM aplikasi
  - job_name: cadvisor
    static_configs:
      - targets: ["192.168.45.20:8080"]
        labels: { host: curalyta-app }

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # Uptime check: endpoint /health (target SLA) — jalur internal dan publik.
  # Target publik ada di file terpisah agar URL tunnel bisa diganti tanpa restart.
  - job_name: blackbox-health
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://192.168.45.20/health"]
        labels: { path: internal }
    file_sd_configs:
      - files: ["/etc/prometheus/targets/health-public.yml"]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Halaman web (frontend produksi dan staging PaaS)
  - job_name: blackbox-web
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://192.168.45.20/"]
        labels: { path: internal }
    file_sd_configs:
      - files: ["/etc/prometheus/targets/web-public.yml"]
    relabel_configs: *blackbox_relabel
