# ============================================================
# Curalyta — stack monitoring & object storage (VM 102 curalyta-monitor)
#
#   prometheus   : pengumpul metrik time-series (:9090)
#   alertmanager : routing alert -> ntfy.sh (push + email) (:9093)
#   grafana      : dashboard (:3000)
#   blackbox     : pemeriksaan HTTP/HTTPS endpoint (uptime + latensi)
#   garage       : object storage S3-compatible untuk backup database (:3900)
#                  (bucket, key, dan lifecycle 30 hari disiapkan oleh
#                  ops/lab/monitor-vm-setup.sh lewat CLI garage + API S3)
#
# Jalankan: cd /opt/curalyta/ops/lab/monitor && docker compose up -d
# Nilai rahasia ada di .env (dibuat oleh monitor-vm-setup.sh, tidak di-commit).
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports: ["9093:9093"]
    logging: *default-logging

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD wajib diisi}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Jakarta
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    logging: *default-logging

  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET wajib diisi}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN wajib diisi}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports: ["3900:3900"]
    logging: *default-logging

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  garage_meta:
  garage_data:
