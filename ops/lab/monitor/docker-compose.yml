# ============================================================
# Curalyta — stack monitoring & object storage (VM 102 curalyta-monitor)
#
#   prometheus   : pengumpul metrik time-series (:9090)
#   alertmanager : routing alert -> ntfy.sh (push + email) (:9093)
#   grafana      : dashboard (:3000)
#   blackbox     : pemeriksaan HTTP/HTTPS endpoint (uptime + latensi)
#   minio        : object storage S3-compatible untuk backup database (:9000/:9001)
#   minio-init   : membuat bucket, lifecycle 30 hari, user khusus backup
#
# Jalankan: cd /opt/curalyta/ops/lab/monitor && docker compose up -d
# Nilai rahasia ada di .env (dibuat oleh monitor-vm-setup.sh, tidak di-commit).
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports: ["9093:9093"]
    logging: *default-logging

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD wajib diisi}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Jakarta
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER wajib diisi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD wajib diisi}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_lab: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      BACKUP_BUCKET: ${BACKUP_BUCKET:-curalyta-db-backups}
      BACKUP_USER: ${BACKUP_S3_ACCESS_KEY:?BACKUP_S3_ACCESS_KEY wajib diisi}
      BACKUP_SECRET: ${BACKUP_S3_SECRET_KEY:?BACKUP_S3_SECRET_KEY wajib diisi}
    volumes:
      - ./minio/backup-policy.json:/policy.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc mb --ignore-existing lab/$$BACKUP_BUCKET
        mc version enable lab/$$BACKUP_BUCKET
        # Lifecycle: objek backup dihapus otomatis setelah 30 hari
        mc ilm rule ls lab/$$BACKUP_BUCKET 2>/dev/null | grep -q '30' || \
          mc ilm rule add --expire-days 30 --noncurrent-expire-days 7 lab/$$BACKUP_BUCKET
        # User khusus backup dengan hak minimal (hanya bucket backup)
        mc admin policy create lab curalyta-backup /policy.json 2>/dev/null || true
        mc admin user add lab $$BACKUP_USER $$BACKUP_SECRET
        mc admin policy attach lab curalyta-backup --user $$BACKUP_USER 2>/dev/null || true
        mc ilm rule ls lab/$$BACKUP_BUCKET
    restart: "no"

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  minio_data:
