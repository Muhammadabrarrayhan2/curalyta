# Application routing, included inside a server block.
#   /api/*   -> backend (Express)
#   /health  -> backend health check (database + response time)
#   /*       -> frontend (static SPA)

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# The backend (helmet) sends its own copies of these; hide them so every
# response carries exactly one, consistent policy set by nginx.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Powered-By;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location = /health {
    proxy_pass http://curalyta_backend/health;
    proxy_read_timeout 10s;
}

location /api/ {
    proxy_pass http://curalyta_backend;
    proxy_read_timeout 90s;
}

location / {
    proxy_pass http://curalyta_frontend;
    proxy_read_timeout 30s;
}
