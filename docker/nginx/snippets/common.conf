# Shared http-level settings for the Curalyta reverse proxy.
# Included once from the active site template.

# JSON access log with response timing (request_time = total time at nginx,
# upstream_response_time = time spent waiting for backend/frontend).
log_format curalyta_json escape=json
  '{"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_response_time":"$upstream_response_time",'
  '"upstream":"$upstream_addr",'
  '"host":"$host",'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent"}';

access_log /var/log/nginx/access.log curalyta_json;

server_tokens off;
client_max_body_size 15M;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

# Docker's embedded DNS, so upstreams are re-resolved after container restarts
resolver 127.0.0.11 valid=10s ipv6=off;

upstream curalyta_backend {
    zone curalyta_backend 64k;
    server backend:4000 resolve;
    keepalive 16;
}

upstream curalyta_frontend {
    zone curalyta_frontend 64k;
    server frontend:8080 resolve;
    keepalive 8;
}
